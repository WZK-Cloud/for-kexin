<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌊 熊可馨 · 生日快乐 · 蓝色大海的祝福</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(145deg, #0b2b44 0%, #1b4f6e 50%, #2a6f8f 100%);
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #e0f0ff;
      line-height: 1.6;
    }

    .birthday-card {
      max-width: 1000px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 3rem 3rem 2rem 2rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(180, 220, 255, 0.3);
      overflow: hidden;
      padding: 2.5rem 2rem 2rem;
    }

    .header { text-align: center; margin-bottom: 2rem; }

    .header h1 {
      font-size: 3.2rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-shadow: 0 5px 15px #0a3b55, 0 0 10px #8ac6f0;
      color: #f0f9ff;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .header h1 span {
      font-size: 2.5rem;
      display: inline-block;
      animation: float 5s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .subhead {
      font-size: 1.2rem;
      color: #b8dcf5;
      letter-spacing: 2px;
      border-bottom: 1px dashed #6fa8c7;
      padding-bottom: 1rem;
      display: inline-block;
    }

    .ocean-container {
      position: relative;
      margin: 1.5rem 0 2rem;
      border-radius: 2rem;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0, 10, 20, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .ocean-image {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.7s ease;
      filter: brightness(1.05) saturate(1.1);
    }

    .ocean-container:hover .ocean-image { transform: scale(1.02); }

    .wave-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, #0a2e42e0, #1d506bc0, transparent);
      color: white;
      padding: 2rem 1.5rem 1rem;
      font-size: 1.3rem;
      text-align: right;
      font-style: italic;
      letter-spacing: 1px;
      text-shadow: 0 2px 6px #00000080;
      pointer-events: none;
    }

    .message-section {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      margin-bottom: 2rem;
    }

    .greeting {
      background: rgba(8, 38, 56, 0.6);
      border-left: 6px solid #67c8ff;
      border-radius: 0 30px 30px 0;
      padding: 1.6rem 2rem;
      box-shadow: 0 10px 20px -5px #041d2b;
    }

    .greeting p {
      font-size: 1.3rem;
      margin-bottom: 0.75rem;
      color: #daf0ff;
    }

    .greeting .name {
      font-size: 2rem;
      font-weight: 600;
      color: #aae0ff;
      text-shadow: 0 0 12px #2f9fd0;
      display: inline-block;
      margin-bottom: 0.5rem;
    }

    .greeting .signature {
      text-align: right;
      font-size: 1.1rem;
      color: #9ac2db;
      margin-top: 1rem;
      font-style: italic;
    }

    .blue-accents {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem 3rem;
      margin: 1.5rem 0 1.8rem;
      font-size: 1.9rem;
      opacity: 0.9;
    }

    .blue-accents span {
      filter: drop-shadow(0 0 8px #4aa9e0);
      animation: gentleWave 4s infinite alternate;
    }

    .blue-accents span:nth-child(2) { animation-delay: 0.6s; }
    .blue-accents span:nth-child(3) { animation-delay: 1.2s; }
    .blue-accents span:nth-child(4) { animation-delay: 1.8s; }
    .blue-accents span:nth-child(5) { animation-delay: 2.4s; }

    @keyframes gentleWave {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-8px) rotate(3deg); }
    }

    .wish-tool {
      background: #d9edfa15;
      border: 1px solid #5f9fc070;
      border-radius: 2rem;
      padding: 1.8rem 1.8rem 2rem;
      margin-top: 0.8rem;
    }

    .wish-tool h3 {
      font-weight: 400;
      font-size: 1.5rem;
      color: #c6e5ff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }

    .wish-tool h3 i { font-style: normal; font-size: 2rem; }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .input-group label { font-size: 1.1rem; color: #b4d9f0; }

    .input-group input {
      flex: 1 1 240px;
      background: #0e2c40;
      border: 1px solid #4183a8;
      border-radius: 60px;
      padding: 0.9rem 1.4rem;
      font-size: 1.1rem;
      color: #e8f4ff;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }

    .input-group input:focus {
      border-color: #9ad6ff;
      box-shadow: 0 0 0 4px #2e7fa050;
      background: #0a2433;
    }

    .input-group input::placeholder { color: #5885a0; font-style: italic; }

    .btn {
      background: #2c7fb0;
      border: none;
      color: white;
      font-size: 1.1rem;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      cursor: pointer;
      font-weight: 500;
      letter-spacing: 1px;
      transition: all 0.2s;
      box-shadow: 0 8px 18px -6px #02131e;
      border: 1px solid #7ac4f0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background: #3a97cc;
      transform: scale(1.02);
      box-shadow: 0 12px 22px -6px #0b3047;
      border-color: #b0e0ff;
    }

    .btn:active { transform: scale(0.98); }

    .wish-output {
      background: #0f3145c0;
      border-radius: 60px;
      padding: 1rem 1.8rem;
      min-height: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #c7e6ff;
      border: 1px dashed #6eaccf;
      word-break: break-word;
      transition: all 0.3s;
      font-style: italic;
      text-align: center;
      margin-top: 1rem;
    }

    .wish-output.glow {
      background: #134a66;
      color: #ffffff;
      border-style: solid;
      border-color: #9fd3ff;
      box-shadow: 0 0 22px #287cac;
    }

    .footer-note {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #82adc7;
      letter-spacing: 1px;
    }

    /* ====== 音乐播放器 ====== */
    .music-player {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(13, 45, 66, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(130, 200, 255, 0.5);
      border-radius: 60px;
      padding: 10px 20px 10px 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .music-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #2c7fb0;
      border: 1px solid #7ac4f0;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .music-btn:hover { background: #3a97cc; transform: scale(1.08); }
    .music-btn.playing { animation: pulse 1.8s infinite; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(122, 196, 240, 0.7); }
      50% { box-shadow: 0 0 0 12px rgba(122, 196, 240, 0); }
    }

    .music-label {
      font-size: 0.9rem;
      color: #c7e6ff;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* ====== 进入遮罩 ====== */
    .enter-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 25, 40, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      color: #e0f0ff;
      text-align: center;
      padding: 2rem;
      transition: opacity 0.8s;
    }

    .enter-overlay.hide {
      opacity: 0;
      pointer-events: none;
    }

    .enter-overlay .big-icon {
      font-size: 5rem;
      animation: float 3s infinite ease-in-out;
    }

    .enter-overlay h2 {
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 3px;
      text-shadow: 0 0 20px #4aa9e0;
    }

    .enter-overlay p {
      font-size: 1.1rem;
      color: #a8d4ef;
      letter-spacing: 2px;
    }

    .enter-overlay .enter-btn {
      margin-top: 1rem;
      background: #2c7fb0;
      border: 1px solid #7ac4f0;
      color: white;
      font-size: 1.2rem;
      padding: 1rem 2.5rem;
      border-radius: 60px;
      cursor: pointer;
      letter-spacing: 3px;
      box-shadow: 0 10px 24px -6px #02131e;
      transition: all 0.3s;
    }

    .enter-overlay .enter-btn:hover {
      background: #3a97cc;
      transform: scale(1.05);
      box-shadow: 0 0 30px #4aa9e0;
    }

    @media (max-width: 600px) {
      .birthday-card { padding: 1.5rem 1rem; border-radius: 2rem; }
      .header h1 { font-size: 2rem; }
      .header h1 span { font-size: 1.6rem; }
      .greeting .name { font-size: 1.6rem; }
      .blue-accents { gap: 1rem; font-size: 1.5rem; }
      .wave-caption { font-size: 1rem; padding: 1rem 1rem 0.7rem; }
      .input-group input { flex: 1 1 100%; }
      .btn { width: 100%; }
      .music-player { bottom: 14px; right: 14px; padding: 8px 14px 8px 10px; }
      .music-btn { width: 40px; height: 40px; font-size: 1.1rem; }
      .music-label { font-size: 0.8rem; }
      .enter-overlay h2 { font-size: 1.5rem; }
      .enter-overlay .big-icon { font-size: 3.5rem; }
      .enter-overlay .enter-btn { font-size: 1rem; padding: 0.9rem 2rem; }
    }
  </style>
</head>
<body>

  <!-- 进入遮罩：用户点一下后，音乐正式播放 -->
  <div class="enter-overlay" id="enterOverlay">
    <div class="big-icon">🌊</div>
    <h2>熊可馨，生日快乐</h2>
    <p>点击下方按钮，开启你的生日祝福</p>
    <button class="enter-btn" id="enterBtn">🎵 进入并播放音乐</button>
  </div>

  <div class="birthday-card">
    <div class="header">
      <h1>
        <span>🌊</span> 熊可馨，生日快乐 <span>🐚</span>
      </h1>
      <div class="subhead">· 如海般自由 · 如蓝般澄澈 ·</div>
    </div>

    <div class="ocean-container">
      <img 
        class="ocean-image" 
        src="https://images.unsplash.com/photo-1505118380757-91f5f5632de0?q=80&w=1200&auto=format&fit=crop" 
        alt="深蓝色的大海与波浪"
      >
      <div class="wave-caption">
        ~ 愿可馨的世界，永远有海风与星光 ~
      </div>
    </div>

    <div class="blue-accents">
      <span>🐟</span>
      <span>💙</span>
      <span>🐚</span>
      <span>🌊</span>
      <span>🧜‍♀️</span>
    </div>

    <div class="message-section">
      <div class="greeting">
        <p>亲爱的 <span class="name">熊可馨</span> ，</p>
        <p>今天是属于你的日子。愿大海的宁静与深邃，都化作你新一岁的底色。愿你永远拥有海风般的自由，浪花般的活力，以及深海般沉静的快乐。</p>
        <p>把这片蓝色送给你 —— 就像你喜欢的，广阔、温柔、深邃。</p>
        <div class="signature">—— 永远支持你的朋友 🌊</div>
      </div>
    </div>

    <div class="wish-tool">
      <h3><i>💌</i> 为可馨写一句海洋祝福</h3>
      <div class="input-group">
        <label for="nameInput">她的名字</label>
        <input type="text" id="nameInput" placeholder="例如：可馨、小熊..." value="熊可馨">
        <button class="btn" id="generateWish">✨ 生成祝福</button>
      </div>
      <div class="wish-output" id="wishOutput">
        点击按钮，生成一句独一无二的蓝色祝福～
      </div>
    </div>

    <div class="footer-note">
      🌊 愿每一朵浪花都为可馨歌唱，生日快乐！ 🐚
    </div>
  </div>

  <!-- 背景音乐 -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="music-player">
    <button class="music-btn" id="musicBtn" title="播放/暂停音乐">▶</button>
    <span class="music-label" id="musicLabel">点我播放音乐 🎵</span>
  </div>

  <script>
    (function() {
      // ===== 祝福生成器 =====
      const nameInput = document.getElementById('nameInput');
      const generateBtn = document.getElementById('generateWish');
      const wishOutput = document.getElementById('wishOutput');

      const oceanWishes = [
        (name) => `🌊 愿 ${name} 的每一天，都如海面初升的太阳，温柔又充满希望。`,
        (name) => `💙 ${name}，愿你的快乐像潮汐一样，永不退去；烦恼像泡沫，一触即散。`,
        (name) => `🐚 把大海的静谧送给 ${name}，愿新的一岁，心纳百川，自在如风。`,
        (name) => `✨ ${name}，愿你遇见所有蓝色奇迹，像深海里的珍珠，独一无二。`,
        (name) => `🌅 致 ${name}：愿海风带走忧愁，海浪送来好运，生日快乐！`,
        (name) => `🧜‍♀️ 如果大海有声音，那一定是它在说：${name}，生日快乐！`,
        (name) => `🐟 愿 ${name} 的生活如珊瑚礁般多彩，如深海般沉静有力。`,
        (name) => `⚓ ${name}，愿你永远拥有启航的勇气，和港湾般的温暖。`,
        (name) => `🌊 为 ${name} 种下一片蓝色，愿它在你心里生长成无边的自由。`,
        (name) => `💙 星辰大海，皆在 ${name} 眼中。生日快乐，永远闪耀。`,
        (name) => `🐚 可馨，愿你的笑容像海面上的粼粼波光，永远清澈明亮。`,
        (name) => `🌊 熊可馨，大海把最温柔的蓝色都借给了你，生日快乐！`
      ];

      function getRandomWish(name) {
        const safeName = name.trim() === '' ? '可馨' : name.trim();
        return oceanWishes[Math.floor(Math.random() * oceanWishes.length)](safeName);
      }

      function updateWish() {
        wishOutput.textContent = getRandomWish(nameInput.value);
        wishOutput.classList.add('glow');
        setTimeout(() => wishOutput.classList.remove('glow'), 600);
      }

      generateBtn.addEventListener('click', updateWish);
      nameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); updateWish(); }
      });
      window.addEventListener('load', () => setTimeout(updateWish, 300));

      // ===== 音乐逻辑（修复版：只由用户点击触发播放）=====
      const music = document.getElementById('bgMusic');
      const musicBtn = document.getElementById('musicBtn');
      const musicLabel = document.getElementById('musicLabel');
      const enterOverlay = document.getElementById('enterOverlay');
      const enterBtn = document.getElementById('enterBtn');

      music.volume = 0.5;

      // 用户点击 "进入并播放音乐" 按钮
      enterBtn.addEventListener('click', () => {
        music.muted = false;
        music.volume = 0.5;

        const playPromise = music.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            musicBtn.textContent = '⏸';
            musicBtn.classList.add('playing');
            musicLabel.textContent = '音乐播放中 🎵';
          }).catch((err) => {
            console.log('播放失败:', err);
            musicLabel.textContent = '播放失败：' + err.message;
          });
        }

        // 淡出遮罩
        enterOverlay.classList.add('hide');
      });

      // 右下角按钮：随时暂停/继续
      musicBtn.addEventListener('click', () => {
        if (music.paused) {
          music.muted = false;
          const playPromise = music.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              musicBtn.textContent = '⏸';
              musicBtn.classList.add('playing');
              musicLabel.textContent = '音乐播放中 🎵';
            }).catch((err) => {
              musicLabel.textContent = '播放失败：' + err.message;
            });
          }
        } else {
          music.pause();
          musicBtn.textContent = '▶';
          musicBtn.classList.remove('playing');
          musicLabel.textContent = '已暂停，点我继续 🎵';
        }
      });
    })();
  </script>
</body>
</html>
